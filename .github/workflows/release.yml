name: Release

# Builds the shippable packages and, on a v* tag, opens a DRAFT GitHub Release.
#
# What CI can and cannot sign
#   * Windows binaries - signed only when WINDOWS_CERT_PFX_BASE64 is configured. The
#     production identity is an EV certificate on a YubiKey, which a runner physically
#     cannot use, so a CI-signed build is not the shippable release.
#   * Guest drivers (VDD/VAD/SHM) - always WDK test-signed. Microsoft attestation
#     signing needs the EV token plus a Partner Center round-trip, so make-release.ps1
#     is invoked in a mode that skips it.
#   * macOS app - signed (and notarized) only when the APPLE_* secrets are configured.
#   * release/resources/linux/ (the Ubuntu guest payload) is built out-of-tree and is
#     not in the repository, so CI packages carry no Ubuntu guest GPU bits.
# Unsigned output is named "-unsigned" and marks the release as a prerelease.
#
# Optional secrets
#   WINDOWS_CERT_PFX_BASE64   base64 of a code-signing .pfx
#   WINDOWS_CERT_PASSWORD     its password
#   APPLE_CERT_P12_BASE64     base64 of a "Developer ID Application" .p12
#   APPLE_CERT_PASSWORD       its password
#   APPLE_TEAM_ID             the 10-character Apple team id
#   APPLE_ID                  Apple ID for notarization (omit to skip notarization)
#   APPLE_APP_PASSWORD        app-specific password for that Apple ID
#
# Optional repository variables (override the runner images if one is retired)
#   WINDOWS_RUNNER (default windows-2025), MACOS_RUNNER (default macos-15)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows ${{ matrix.platform }}
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install the Windows Driver Kit
        shell: pwsh
        run: |
          # The three guest drivers build with the WDK toolsets (WindowsUserModeDriver10.0 /
          # WindowsKernelModeDriver10.0), which the runner image does not ship. choco installs
          # the kit; WDK.vsix wires its MSBuild targets into the VS 2022 (v143) install that
          # msbuild resolves - without the vsix the driver projects fail to load.
          choco install windowsdriverkit11 -y --no-progress
          $vsix = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Vsix' -Recurse -Filter 'WDK.vsix' -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vsix) { throw 'WDK installed but no WDK.vsix found under Windows Kits\10\Vsix.' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere." }
          $vsRoot = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          if (-not $vsRoot) { throw 'vswhere could not locate a Visual Studio install.' }
          $installer = Join-Path $vsRoot 'Common7\IDE\VSIXInstaller.exe'
          if (-not (Test-Path $installer)) { throw "VSIXInstaller not found at $installer." }
          Write-Host "Installing $($vsix.FullName)"
          $p = Start-Process -FilePath $installer -ArgumentList '/q', '/a', $vsix.FullName -Wait -PassThru
          # 1001 = this extension is already installed.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 1001) { throw "VSIXInstaller failed (exit $($p.ExitCode))." }

      - name: Import the code-signing certificate (if configured)
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host 'No WINDOWS_CERT_PFX_BASE64 secret - this build will be packaged unsigned.'
            "thumbprint=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $imp = @{ FilePath = $pfx; CertStoreLocation = 'Cert:\CurrentUser\My' }
          if ($env:PFX_PASSWORD) { $imp.Password = (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force) }
          $cert = Import-PfxCertificate @imp
          Remove-Item $pfx -Force
          if (-not $cert.HasPrivateKey) { throw 'The imported certificate has no private key.' }
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Imported $($cert.Subject) [$($cert.Thumbprint)]"

      - name: Build Release|${{ matrix.platform }}
        shell: pwsh
        env:
          # The AppSandboxPackage project's post-build would otherwise run
          # make-release.ps1 mid-build; the packaging step below runs it explicitly.
          ASB_SKIP_PACKAGE_PROJECT: '1'
        run: msbuild AppSandbox.sln /t:Build /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m /v:minimal /nologo

      - name: Stage the guest payloads into the output tree
        shell: pwsh
        run: |
          # AppSandbox.vcxproj's post-build copies release\resources -> bin\<cfg>\resources, but the
          # guest helper .exes (input/displays/clipboard/audio) come from projects the solution can
          # schedule after it, so repeat the copy now that the whole build is done. Merging over the
          # existing folder leaves the win-mesa-gl DLLs the post-build already put there.
          if (-not (Test-Path 'release\resources')) { throw 'release\resources missing - the guest tool projects did not build.' }
          $bin = if ('${{ matrix.platform }}' -eq 'ARM64') { 'bin\Release-ARM64' } else { 'bin\Release' }
          $dst = Join-Path $bin 'resources'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'release\resources\*' $dst -Recurse -Force
          Get-ChildItem $dst -Recurse -File | ForEach-Object { Write-Host ('  ' + $_.FullName.Substring((Resolve-Path $dst).Path.Length + 1)) }

      - name: Package
        shell: pwsh
        run: |
          # -SignMode store signs with the imported PFX; -SignMode none packages unsigned.
          # Both skip driver attestation, so the drivers in the zip stay WDK test-signed.
          $tp = '${{ steps.cert.outputs.thumbprint }}'
          $mode = if ($tp) { @('-SignMode', 'store', '-CertThumbprint', $tp) } else { @('-SignMode', 'none') }
          & .\tools\sign\make-release.ps1 -NoBuild -Platform ${{ matrix.platform }} @mode

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: appsandbox-win-${{ matrix.platform }}
          path: bin/Release*/AppSandbox-*.zip
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import the Developer ID certificate (if configured)
        id: cert
        env:
          P12_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "${P12_B64}" ] || [ -z "${TEAM_ID}" ]; then
            echo 'No APPLE_CERT_P12_BASE64 / APPLE_TEAM_ID secret - building an unsigned app.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'notarize=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A dedicated temporary keychain, added to the user search list so xcodebuild and
          # codesign find the identity; it expires with the runner.
          KEYCHAIN="$RUNNER_TEMP/appsandbox-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD:-}" \
              -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" |
                      sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo 'the imported certificate is not a Developer ID Application identity' >&2
            exit 1
          fi
          echo "identity: $IDENTITY"
          # Build-time signing settings (gitignored file the committed Local.xcconfig
          # optionally includes) - see tools/sign/SIGNING_MAC.md.
          cat > src/app_mac/xcconfig/LocalUser.xcconfig <<EOF
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_STYLE[config=Release] = Manual
          CODE_SIGN_IDENTITY[config=Release] = Developer ID Application
          ENABLE_HARDENED_RUNTIME[config=Release] = YES
          OTHER_CODE_SIGN_FLAGS[config=Release] = --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS[config=Release] = NO
          EOF
          # make-release-mac.sh reads its private details from this (gitignored) file.
          cat > tools/sign/mac-signing.local.json <<EOF
          {
            "signingIdentity": "$IDENTITY",
            "teamId": "$TEAM_ID",
            "appleId": "${APPLE_ID:-}",
            "appSpecificPassword": "${APPLE_APP_PASSWORD:-}"
          }
          EOF
          echo 'signed=true' >> "$GITHUB_OUTPUT"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            echo 'notarize=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No APPLE_ID / APPLE_APP_PASSWORD - signing without notarization.'
            echo 'notarize=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        run: |
          if [ '${{ steps.cert.outputs.signed }}' = 'true' ]; then
            if [ '${{ steps.cert.outputs.notarize }}' = 'true' ]; then
              tools/sign/make-release-mac.sh
            else
              tools/sign/make-release-mac.sh --no-notarize
            fi
            exit 0
          fi
          # Unsigned fallback: the same zip layout make-release-mac.sh publishes (the .app
          # and headless-api/ at the zip root), named so it cannot pass for a release.
          VERSION="$(tools/sign/asb-version.sh short)"
          xcodebuild -project AppSandbox.xcodeproj -scheme AppSandbox -configuration Release \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=bin/Release/AppSandbox.app
          [ -d "$APP" ] || { echo "build produced no app at $APP" >&2; exit 1; }
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/AppSandbox.app"
          mkdir -p "$STAGE/headless-api"
          cp tools/headless-api/asb.py tools/headless-api/README.md "$STAGE/headless-api/"
          ditto tools/headless-api/examples "$STAGE/headless-api/examples"
          ditto tools/headless-api/tests "$STAGE/headless-api/tests"
          find "$STAGE/headless-api" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$STAGE/headless-api" -type f -name '*.pyc' -delete
          mkdir -p bin/Release/release_package
          ditto -c -k "$STAGE" "bin/Release/release_package/AppSandbox-$VERSION-mac-arm64-unsigned.zip"
          rm -rf "$STAGE"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: appsandbox-mac-arm64
          path: bin/Release/release_package/*.zip
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Directory.Build.props
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(tools/sign/asb-version.sh short)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $VERSION in Directory.Build.props" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An unsigned asset must never look like a shippable build.
          EXTRA=()
          if ls dist/*-unsigned*.zip >/dev/null 2>&1; then EXTRA+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "App Sandbox $GITHUB_REF_NAME" "${EXTRA[@]}" \
              dist/*.zip dist/SHA256SUMS.txt
          # Append the provenance caveats to the generated notes; the release stays a draft
          # so a maintainer reviews (or replaces the assets with token-signed ones) before publishing.
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          gh release edit "$GITHUB_REF_NAME" --notes "$BODY

          ---
          **Built by CI.** The guest drivers in these packages are WDK test-signed: Microsoft
          attestation signing needs the EV token and a Partner Center submission, which a runner
          cannot do. Windows binaries are signed only if a certificate secret is configured, and
          the Ubuntu guest payload (\`release/resources/linux/\`) is built out-of-tree and is not
          included. Ship a locally produced, EV-signed and attestation-signed build instead."
